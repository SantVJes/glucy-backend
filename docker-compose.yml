# Glucy: la API y PostgreSQL con TimescaleDB (paso 4 de la fase 2).
#
#   cp .env.example .env     # y llenar los valores; .env está en .gitignore
#   docker compose up -d
#
# Ningún usuario ni contraseña vive en este archivo: salen del .env.

services:
  base:
    # La edición Apache 2: libre de verdad. Trae hipertablas y time_bucket; no trae
    # continuous aggregates ni compresión, y por eso los agregados los llena el
    # pipeline (decisión 2.6).
    image: timescale/timescaledb:2.31.0-pg16-oss
    environment:
      POSTGRES_DB: glucy
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Con nombre: sin él, `docker compose down` borra la base y no se nota hasta que
    # alguien pierde una semana de datos de prueba.
    volumes: [datos:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d glucy"]
      interval: 5s
      retries: 10
    # Sin `ports`: la base solo se alcanza desde la red interna de compose. Son datos de
    # salud aunque estén seudonimizados.

  api:
    build: .
    env_file: .env
    # service_healthy y no a secas: sin eso la API arranca antes que la base y
    # `alembic upgrade head` falla.
    depends_on:
      base: {condition: service_healthy}
    ports: ["8000:8000"]

  # El panel de seguimiento (fase 6, paso 2). Los ocho paneles del Documento 2, §10.
  panel:
    image: grafana/grafana-oss:11.6.5
    depends_on:
      base: {condition: service_healthy}
    environment:
      # Las credenciales salen del .env; aquí no vive ninguna.
      GF_SECURITY_ADMIN_USER: ${GLUCY_GRAFANA_USUARIO}
      GF_SECURITY_ADMIN_PASSWORD: ${GLUCY_GRAFANA_SECRETO}
      # Las tres que importan de verdad, y por qué:
      GF_AUTH_ANONYMOUS_ENABLED: "false"   # el panel detrás de autenticación, siempre
      GF_USERS_ALLOW_SIGN_UP: "false"      # nadie se da de alta solo
      # Una «instantánea» de Grafana se publica por omisión en un servidor de Grafana Labs,
      # fuera de este servidor y sin autenticación. Son datos de salud: queda apagado.
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # El origen de datos aprovisionado lee estas dos (grafana/lector.sql las crea).
      GLUCY_GRAFANA_DB_USUARIO: ${GLUCY_GRAFANA_DB_USUARIO}
      GLUCY_GRAFANA_DB_SECRETO: ${GLUCY_GRAFANA_DB_SECRETO}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/tableros:/etc/grafana/tableros:ro
      - panel:/var/lib/grafana
    # **Solo 127.0.0.1**, no `3000:3000`. Con `3000:3000` Docker abre el puerto en todas las
    # interfaces y además atraviesa el cortafuegos del anfitrión sin avisar: el panel queda en
    # internet abierto, que es justo lo que el Documento 2 prohíbe. Para verlo de fuera, un
    # túnel por SSH: `ssh -L 3000:127.0.0.1:3000 <servidor>`.
    ports: ["127.0.0.1:3000:3000"]

volumes:
  datos:
  panel:
