[project]
name = "glucy-backend"
version = "0.0.1"
description = "API REST y pipeline de datos de Glucy"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E, F: errores y pyflakes. I: orden de los imports. UP: modernizaciones de sintaxis.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: necesitan PostgreSQL con TimescaleDB en GLUCY_DATABASE_URL_POSTGRES; sin ella se saltan",
]
