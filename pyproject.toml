[project]
name = "glucy-backend"
version = "0.0.1"
description = "API REST y pipeline de datos de Glucy"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E, F: errores y pyflakes. I: orden de los imports. UP: modernizaciones de sintaxis.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# E402: la pantalla del simulador tiene que poner la raíz del repositorio en `sys.path`
# **antes** de importar `app...`, porque Streamlit solo garantiza la carpeta del script. El
# import no puede ir arriba: ahí está el motivo, no un descuido.
"simulador/pantalla.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: necesitan PostgreSQL con TimescaleDB en GLUCY_DATABASE_URL_POSTGRES; sin ella se saltan",
]
